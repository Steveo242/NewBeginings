<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<!-- Bloody Seafood: a blood drop on a brass porthole, a shark fin cutting through it -->
	<defs>
		<linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff4c8"/>
			<stop offset="0.4" stop-color="#ffd35a"/>
			<stop offset="0.65" stop-color="#d99a22"/>
			<stop offset="1" stop-color="#7a4a0e"/>
		</linearGradient>
		<radialGradient id="sea" cx="0.5" cy="0.35" r="0.7">
			<stop offset="0" stop-color="#2b5f6e"/>
			<stop offset="1" stop-color="#0b1f27"/>
		</radialGradient>
		<radialGradient id="blood" cx="0.38" cy="0.62" r="0.6">
			<stop offset="0" stop-color="#ff4a52"/>
			<stop offset="0.55" stop-color="#b3101e"/>
			<stop offset="1" stop-color="#4a0307"/>
		</radialGradient>
	</defs>
	<circle cx="32" cy="32" r="30" fill="url(#brass)"/>
	<circle cx="32" cy="32" r="24.5" fill="url(#sea)" stroke="#2a0006" stroke-width="1.5"/>
	<path d="M32 9 C36 19 45 27 45 37 A13 13 0 0 1 19 37 C19 27 28 19 32 9 Z" fill="url(#blood)" stroke="#2a0006" stroke-width="1.5"/>
	<ellipse cx="26.5" cy="34" rx="2.6" ry="4.6" transform="rotate(-20 26.5 34)" fill="#ffe6e2" opacity="0.85"/>
	<path d="M24 47 C29 45 33 38 34 30 C37 36 40 42 44 46 Z" fill="#1d2a30" stroke="#0b1114" stroke-width="1"/>
	<path d="M15 47 Q32 51 49 47" fill="none" stroke="#cfe6ee" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
</svg>
